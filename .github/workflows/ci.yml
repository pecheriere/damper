name: ci

on:
  pull_request:
  push:
    branches: [main]
  # Merges by bots start no push workflow and main does not require branches to
  # be up to date, so this daily run catches a broken main within a day.
  schedule:
    - cron: "47 4 * * *"
  # A caller must grant issues: write, for report-red-main, even though a call
  # from anything but main skips it: GitHub refuses to start it otherwise.
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustup reads the channel and components from rust-toolchain.toml, so
      # the version lives in one place and no third-party action is needed.
      - name: Install the Rust toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install --profile minimal
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Build the documentation
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.19.0 --locked
      - run: cargo deny check

  test:
    runs-on: macos-15
    # The suite itself runs in about 16 s locally; the rest of the job is the
    # cold build of the workspace and of cargo-nextest, which only the runner can
    # measure. The e2e self-feed assertions need at least 3 cores, and GitHub's
    # macOS arm64 runner has 3.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustup reads the channel and components from rust-toolchain.toml, so
      # the version lives in one place and no third-party action is needed.
      - name: Install the Rust toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install --profile minimal
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install cargo-nextest
        run: cargo install cargo-nextest --version 0.9.151 --locked
      - run: cargo nextest run --workspace --locked

  crate-age:
    # Compares Cargo.lock with the PR's base, so it only runs on pull requests.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The PR's merge commit and its first parent, the base it merges into.
          fetch-depth: 2
          persist-credentials: false
      - name: Lint and test the CI scripts
        run: |
          python3 -m venv "$RUNNER_TEMP/lint"
          "$RUNNER_TEMP/lint/bin/pip" install --quiet --require-hashes --only-binary :all: \
            -r .github/requirements-lint.txt
          "$RUNNER_TEMP/lint/bin/ruff" check --config .github/ruff.toml .github/scripts scripts/acceptance
          "$RUNNER_TEMP/lint/bin/ruff" format --check --config .github/ruff.toml .github/scripts scripts/acceptance
          python3 -I -m unittest discover -s .github/scripts -p 'test_*.py'
          python3 -I -m unittest discover -s scripts/acceptance -p 'test_*.py'
      - name: Refuse crate versions published less than 7 days ago
        run: python3 -I .github/scripts/crate_age.py --base HEAD^1

  # A failed run on main only tells whoever reads the notification, so keep one
  # issue open while main is red. It links the run, and the run holds the details.
  report-red-main:
    needs: [lint, test, crate-age]
    if: >-
      always() && (github.event_name == 'push' || github.event_name == 'schedule')
      && github.ref == 'refs/heads/main'
      && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write # to open or comment on the one issue
    steps:
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT: ${{ github.sha }}
        run: |
          title="CI failed on main"
          number=$(gh issue list --state open --search "in:title \"$title\"" \
            --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "Still failing at $COMMIT: $RUN_URL"
          else
            gh issue create --title "$title" --body "Failed at $COMMIT: $RUN_URL

          Fix main before merging anything else, and close this issue once main's CI passes."
          fi
