# A hung test fails instead of stalling the run: nextest has no limit by default.
# Measured on 2026-11-09 (291 tests, 15.6 s in total): the slowest test,
# flows::two_builds_share_fairly, takes 14.6 s. A test is killed after three
# periods, 60 s, about four times the slowest. The 20 s period keeps the 14.6 s
# test from flickering SLOW.
[profile.default]
slow-timeout = { period = "20s", terminate-after = 3 }
