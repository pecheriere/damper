[package]
name = "damper"
description = "Command line for controlling damper."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
damper-core = { version = "0.1.0", path = "../core" }
damper-proto = { version = "0.1.0", path = "../proto" }
clap = { version = "4.6.7", features = ["derive"] }
nix = { version = "0.31.3", features = ["user"] }
serde_json = "1.0.154"
sysctl = "0.7.1"

[dev-dependencies]
insta = "1.49.0"
tempfile = "3.27.0"
