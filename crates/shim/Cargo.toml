[package]
name = "damper-shim"
description = "The cargo shim that joins damper's jobserver pool."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
damper-core = { version = "0.1.0", path = "../core" }
damper-proto = { version = "0.1.0", path = "../proto" }
nix = { version = "0.31.3", features = ["signal", "fs"] }
serde_json = "1.0.154"
signal-hook = "0.4.6"

[dev-dependencies]
tempfile = "3.27.0"
